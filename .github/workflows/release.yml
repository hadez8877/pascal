name: Release

on:
  push:
    branches:
      - main
      - next

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: true

jobs:
  release:
    name: Changelog PR or Release
    if: ${{ github.repository_owner == 'hadez8877' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Build Packages
        run: pnpm exec turbo run build --filter="...[HEAD^1]" --concurrency=4

      - name: Setup git commiter
        id: commiter
        uses: ./.github/actions/setup-git-commiter
        with:
          pascal-client-id: ${{ vars.PASCAL_CLIENT_ID }}
          pascal-app-secret: ${{ secrets.PASCAL_APP_SECRET }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Note: pnpm install after versioning is necessary to refresh lockfile
          version-script: pnpm run version
          publish-script: pnpm exec changeset publish
          commit-message: '[ci] release'
          pr-title: '[ci] release'
          github-token: ${{ steps.commiter.outputs.token }}

      - name: Check if pascal-vscode was published
        id: vscode-published
        if: steps.changesets.outputs.published == 'true'
        run: |
          if echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -e '.[] | select(.name == "pascal-vscode")' > /dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare vscode folder
        if: steps.vscode-published.outputs.published == 'true'
        working-directory: ./packages/editors/vscode
        run: |
          rm -rf node_modules
          # Also delete root package.json and node_modules to avoid vsce picking up any monorepo info
          mv ../../../package.json ../../../package.temp.json
          rm -rf ../../../node_modules
          sleep 60s # wait for npm registry to update
          npm i --workspaces=false # vsce does not support pnpm, so we need to pretend this is not a monorepo and use npm
  
      - name: Publish to OpenVSX
        if: steps.vscode-published.outputs.published == 'true'
        working-directory: ./packages/editors/vscode
        run: |
          npx ovsx publish -p ${{ secrets.OVSX_TOKEN }}

      - name: Restore root package.json and node_modules
        if: steps.vscode-published.outputs.published == 'true'
        run: |
          mv ./package.temp.json ./package.json
          pnpm install --frozen-lockfile

      - name: Dispatch post-release event
        if: steps.changesets.outputs.published == 'true' && github.ref_name == 'main'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.commiter.outputs.token }}
          event-type: release-published
